<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      T-015 spike debug page. Built only with MORTISE_SPIKE_BUILD=1 and never loaded by the product.
      frame-src is scoped to the sample extension's own origin; its document gets its own strict CSP
      from the mortise-ext handler (default-src 'none'; script-src 'self'; ...).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src mortise-ext://acme.tasks; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>Mortise extension sandbox spike (debug)</title>
    <style>
      body {
        margin: 0;
        padding: 1.5rem;
        background: #17181c;
        color: #e6e6e6;
        font: 14px/1.5 system-ui, sans-serif;
      }
      main.spike {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.25rem;
        color: #ffb454;
      }
      h2 {
        font-size: 0.95rem;
        margin: 1.5rem 0 0.5rem;
      }
      p {
        color: #b9bcc7;
      }
      .frames {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      iframe.extension-frame {
        width: 300px;
        height: 180px;
        border: 1px solid #3a3d47;
        background: #101116;
      }
      .controls {
        display: flex;
        gap: 0.5rem;
        margin: 0.5rem 0;
      }
      button {
        background: #262933;
        color: #e6e6e6;
        border: 1px solid #454956;
        border-radius: 4px;
        padding: 0.35rem 0.7rem;
        cursor: pointer;
      }
      .status {
        color: #8fd694;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #3a3d47;
        padding: 0.25rem 0.6rem;
        text-align: left;
      }
      .log {
        max-height: 14rem;
        overflow: auto;
        padding-left: 1.2rem;
        color: #b9bcc7;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../spikes/extension-sandbox/renderer/main.ts"></script>
  </body>
</html>
